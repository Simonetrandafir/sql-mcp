
version: 2

updates:
  # Dipendenze Node.js / TypeScript
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Dipendenze GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    target-branch: "dev"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
